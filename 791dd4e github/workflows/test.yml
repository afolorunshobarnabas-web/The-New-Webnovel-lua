# ==========================================
# OFFICIAL SHOSETSU EXTENSION CI/CD WORKFLOW
# ==========================================

# Defines the sequence of execution stages
stages:
  - build
  - test

# Global variables used across jobs
variables:
  # Instructs Gradle to use a local cache to speed up subsequent pipeline runs
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

# ------------------------------------------
# JOB 1: Build and Compile Extensions
# ------------------------------------------
build_extensions:
  stage: build
  # Official Android/Java build image matching Shosetsu's framework requirements
  image: eclipse-temurin:17-jdk-alpine
  before_script:
    - apk add --no-cache bash git curl
    - chmod +x ./gradlew || true
  script:
    # Compiles the repository extensions and generates the multi-extension packages
    - ./gradlew assembleDebug || ./gradlew build
  artifacts:
    name: "shosetsu-extensions-build-${CI_COMMIT_REF_SLUG}"
    when: on_success
    expire_in: 1 week
    paths:
      # Saves the compiled extension packages for download or testing
      - "**/build/outputs/**/*.apk"
      - "**/build/libs/**/*.jar"

# ------------------------------------------
# JOB 2: Run Automated Parser Testing
# ------------------------------------------
test_parsers:
  stage: test
  image: eclipse-temurin:17-jdk-alpine
  before_script:
    - apk add --no-cache bash git
    - chmod +x ./test-server.sh || true
  script:
    # 1. Regenerates the unified index configuration index.json mapping file
    - java -jar bin/extension-tester.jar --generate-index
    
    # 2. Runs structural automated sanity checks on your specific extension ID
    - java -jar bin/extension-tester.jar --id 982374105 --listings 1
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - index.json
